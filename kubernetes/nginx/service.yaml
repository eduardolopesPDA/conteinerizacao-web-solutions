# ============================================
# Service - Nginx
# ============================================
# Expondo Nginx na porta 30080
# Acesso externo: http://<node-ip>:30080
# ============================================

apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: web-solutions
  labels:
    app: nginx
    company: websolutions
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
