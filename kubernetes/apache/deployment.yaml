# ============================================
# Deployment - Apache HTTPD
# ============================================
# Replica 2 instâncias do Apache
# Porta interna: 80
# ============================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-deployment
  namespace: web-solutions
  labels:
    app: apache
    tier: backend
    company: websolutions
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apache
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: apache
        tier: backend
    spec:
      containers:
        - name: apache
          image: apache-web-solutions:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: apache-config
              mountPath: /usr/local/apache2/conf/httpd.conf
              subPath: httpd.conf
              readOnly: true
      volumes:
        - name: apache-config
          configMap:
            name: apache-config
      restartPolicy: Always
