# ============================================
# Configuração Customizada - Apache HTTPD
# ============================================
# Otimizado para performance e segurança
# ============================================

ServerRoot "/usr/local/apache2"
Listen 80
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule headers_module modules/mod_headers.so
LoadModule mime_module modules/mod_mime.so
LoadModule status_module modules/mod_status.so

ServerAdmin admin@websolutions.com.br
ServerName localhost

# Desabilitar reveal de versão
ServerTokens Prod
ServerSignature Off

# Logging
ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 combined

# Diretórios
DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Health check endpoint
<Directory "/usr/local/apache2/htdocs/healthz">
    Require all granted
</Directory>

# Types
TypesConfig conf/mime.types

# Default page
DirectoryIndex index.html

# Headers de segurança
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options SAMEORIGIN
    Header always set X-XSS-Protection "1; mode=block"
</IfModule>

# MPM Event Configuration
<IfModule mod_mpm_event.c>
    StartServers            2
    MinSpareThreads         25
    MaxSpareThreads         75
    ThreadsPerChild         25
    MaxRequestWorkers       400
    MaxConnectionsPerChild  0
</IfModule>
