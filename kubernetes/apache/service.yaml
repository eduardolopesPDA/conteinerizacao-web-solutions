# ============================================
# Service - Apache HTTPD
# ============================================
# Expondo Apache na porta 30081
# Acesso externo: http://<node-ip>:30081
# ============================================

apiVersion: v1
kind: Service
metadata:
  name: apache-service
  namespace: web-solutions
  labels:
    app: apache
    company: websolutions
spec:
  type: NodePort
  selector:
    app: apache
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30081
      protocol: TCP
